name: Release

# 打 v* 标签（如 v1.0.0）时自动构建并发布 Release。
# 也支持在 Actions 页面手动触发（workflow_dispatch），便于验证。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签名（手动触发时使用，例如 v1.0.0）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布（win-x64）
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore src/GitHubSwitcher/GitHubSwitcher.csproj

      - name: 构建（Release）
        run: dotnet build src/GitHubSwitcher/GitHubSwitcher.csproj -c Release --no-restore

      # 自包含单文件：目标机器无需安装 .NET 运行时
      # 说明：WPF 不支持裁剪，所以不传 PublishTrimmed
      - name: 发布为自包含单文件
        run: >
          dotnet publish src/GitHubSwitcher/GitHubSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: 核对产物
        shell: pwsh
        run: |
          Write-Host "=== 发布产物 ==="
          Get-ChildItem publish | ForEach-Object {
            "{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
          }
          if (-not (Test-Path "publish/GitHubSwitcher.exe")) {
            throw "未找到 GitHubSwitcher.exe，构建失败"
          }

      - name: 打包为 zip
        shell: pwsh
        run: |
          # 版本号优先用 tag，手动触发时用输入值，否则用 0.0.0-dev
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") {
            $tag = "0.0.0-dev"
          }
          $name = "GitHubSwitcher-$tag-win-x64"
          Write-Host "打包名称: $name"
          Compress-Archive -Path "publish/*" -DestinationPath "$name.zip" -Force
          Get-ChildItem "$name.zip" | ForEach-Object {
            "zip: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
          }
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $notes = @"
          ## GitHub 账号切换器 ${{ github.ref_name }}

          一键切换 GitHub 账号，浏览器与命令行同步切换。

          ### 使用方法
          1. 下载下面的 zip 并解压到任意目录
          2. 双击 ``GitHubSwitcher.exe``
          3. 首次建议先到「设置」页点一次「关闭 App-Bound 加密」
          4. 到「添加账号」登录你的 GitHub 账号

          无需安装 .NET 运行时（已打包为自包含单文件）。

          ### 系统要求
          - Windows 10 / 11 x64
          - Google Chrome

          ### 说明
          - 切换后你日常用的 Chrome 即为对应账号，书签不受影响
          - 换电脑需重新登录一次（浏览器登录态无法跨机器迁移）
          - 详见仓库 README
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      - name: 上传构建产物（供手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 14

      # 仅在推送 tag 时创建 Release；手动触发只产出 artifact
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GitHub 账号切换器 ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ env.ZIP_NAME }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
